name: CD AWS Cloud Spring-React

on:
  workflow_run:
    workflows: ["CI AWS Cloud Spring-React"]
    types:
      - completed

jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        host:
          - ${{ secrets.EC2_HOST_2A }}
          - ${{ secrets.EC2_HOST_2C }}

    steps:

      - name: Deploy to EC2

        uses: appleboy/ssh-action@v1

        with:

          host: ${{ matrix.host }}

          username: ubuntu

          key: ${{ secrets.EC2_KEY }}

          script: |

            cd ~/spring_react

            export DOCKER_SPRING_IMAGE=${{ secrets.DOCKER_SPRING_IMAGE }}

            export DOCKER_REACT_IMAGE=${{ secrets.DOCKER_REACT_IMAGE }}

            docker compose pull

            # docker compose down # down 하면 잠깐 서비스 중단 발생.

            docker compose up -d --remove-orphans
            
            docker image prune -af