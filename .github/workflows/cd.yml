name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/spring_react
            
            export DOCKER_SPRING_IMAGE=${{ secrets.DOCKER_SPRING_IMAGE }}
            export DOCKER_REACT_IMAGE=${{ secrets.DOCKER_REACT_IMAGE }}            

            echo "===== Pull latest Docker images ====="
            docker compose pull

            echo "===== Restart containers ====="
            docker compose down
            docker compose up -d